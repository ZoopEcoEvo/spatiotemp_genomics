# =====================================================================
# Copepod lcWGS workflow configuration
# Paths are relative to the project root (run snakemake from there).
# Record every change to thresholds in the roadmap's Decision log.
# =====================================================================

# ---- Sample sheets ---------------------------------------------------
samples: config/samples.tsv      # one row per individual
units: config/units.tsv          # one row per individual x sequencing lane

# ---- Reference -------------------------------------------------------
# reference.fa = GCF_053477335.1 nuclear assembly (28 sequences) + one partial
# mitogenome contig per clade (mtDNA_F, mtDNA_S, mtDNA_X, mtDNA_IV), so mito
# reads map to their own clade's contig rather than to nuclear NUMTs.
reference:
  genome: data/reference/genome/reference.fa

# Table of mito contigs: contig, clade, ..., coi_start, coi_end (1-based,
# inclusive, COI barcode region; contigs oriented COI-forward)
mito_contigs: data/reference/mito/mtDNA_clades.tsv

# Published COI haplotypes, clade in each name (e.g. Hap_73_S)
coi_references: metadata/coi_references/coi_clade_refs.fasta

# ---- Clades and populations ------------------------------------------
# Stage 2 (within-clade) rules activate once this file exists.
clades:
  file: metadata/clade_assignments.tsv
  column: clade                  # column holding the final clade label
  exclude: ["admixed", "unassigned", "NA", ""]

# A "population" = clade x these sample-sheet columns
population_columns: [site, sampling_event]
min_pop_size: 8                  # populations smaller than this are skipped

# ---- Read processing -------------------------------------------------
fastp:
  extra: "--detect_adapter_for_pe --trim_poly_g --length_required 30"

markdup:
  optical_distance: 2500         # 2500 for patterned flow cells (NovaSeq); 100 otherwise

# ---- Mitochondrial consensus (Stage 1) -------------------------------
mito:
  min_depth: 3                   # min reads to call a base
  call_fraction: 0.7             # min fraction of reads agreeing
  min_mapq: 20                   # reads counted/used on mito contigs
  max_missing: 0.2               # drop COI sequences with > 20% N
  min_majority: 0.9              # flag samples with < 90% of COI-region reads on one clade contig
  min_coi_reads: 20              # fewer COI-region reads than this -> low_mito_reads (no clade call)

# ---- ANGSD -----------------------------------------------------------
angsd:
  n_chunks: 15                   # one per chromosome (unplaced NW_ scaffolds and mito contigs are excluded; see site_filter)
  min_mapq: 30
  min_q: 20
  only_proper_pairs: 0           # 0 = keep improperly paired reads; MAPQ>=30 applies per read (decision log 2026-10-20)
  min_ind_frac: 0.5              # site needs data in >= this fraction of individuals
  max_depth_hist: 5000           # upper bin for depth histograms
  # Sites analysed in Stages 1-2: unmasked nuclear sequence minus NUMTs and
  # ngsParalog sites, built by rule final_sites (target `sites_final`).
  # The per-clade depth and paralog-candidate runs use the BASE list
  # (results/02_sites/sites/unmasked_nuclear.txt) instead.
  sites_file: results/02_sites/sites/final_sites.txt
  # Depth filters, set per clade AFTER inspecting
  #   results/02_sites/depth_by_clade/depth_by_clade.tsv (+ .pdf)
  # Values are MEAN DEPTH PER INDIVIDUAL [min, max]; each ANGSD run multiplies
  # them by its number of individuals (-setMinDepth / -setMaxDepth), so the same
  # values work for a whole clade and for its site x season populations.
  # Keys: clade names; "all" = the all-sample Stage 1 run. Missing key = no depth filter.
  depth_bounds: {X: [0, 3.35], F: [0, 3.30], S: [0, 3.53], IV: [0, 3.48], all: [0, 3.4]}   # 2026-10-22: max = 2.5 x median of minInd-passing sites; min via -minInd
  #   X:  [0.10, 2.0]
  #   F:  [0.08, 1.5]
  #   all: [0.0, 1.8]
  snp_pval: 1e-6
  min_maf: 0.05

# ---- Site filters and per-clade depth (end of Stage 0) ------------------
site_filter:
  repeat_mask: data/reference/masks/softmasked_repeats.bed   # RefSeq soft-masking (BED, 0-based)
  extra_mask_beds: []            # any further BEDs to remove (NUMT + ngsParalog masks are added automatically)
  exclude_prefixes: [NW_]        # unplaced scaffolds (inconsistent depth across clades)
  # Provisional clade labels for the per-clade depth runs, until Stage 1 writes
  # metadata/clade_assignments.tsv (all 402 kept samples agree with their mito reads)
  depth_groups_file: metadata/sample_metadata.tsv
  depth_groups_column: prior_clade
  depth_groups_exclude: [A_hudsonica, "", NA]
  depth_use_min_ind: true        # per-clade depth histograms count only sites passing angsd.min_ind_frac

# NUMTs: clade mito contigs BLASTed against the nuclear chromosomes
numt:
  query: data/reference/mito/mtDNA_clades.fa
  evalue: 1e-10
  min_length: 50                 # bp aligned
  pad_bp: 150                    # ~ one read length either side

# ngsParalog (mismapping / collapsed duplicates), per provisional clade
paralog:
  ngsparalog_bin: /work/pi_matthew_sasaki_uml_edu/software/ngsParalog/ngsParalog   # built by workflow/setup_ngsparalog.sh
  snp_pval: 1e-6                 # SNP candidates (ANGSD, inside depth bounds)
  min_maf: 0.05
  p_adjust: fdr                  # fdr (Benjamini-Hochberg) | bonferroni; within each clade
  alpha: 0.05
  pad_bp: 0                      # mask flagged SNPs only (2026-10-22: +/-100 bp removed 29-41% of S/IV SNPs)

# ---- Structure (Stages 1-2) ------------------------------------------
structure:
  thin_every: 10                 # keep every Nth SNP for PCA/admixture (reduces LD & runtime)
  pcangsd_extra: ""              # e.g. "--selection" for within-clade selection scans
  ngsadmix_K: [2, 3, 4, 5, 6]
  ngsadmix_reps: 3
  pca_color_by: [plate, site, sampling_event]   # sample-sheet columns used to color PCA plots

# ---- Diversity (Stage 2) ---------------------------------------------
diversity:
  window: 50000
  step: 10000

# ---- Threads ---------------------------------------------------------
threads:
  fastp: 4
  bwa: 8
  samtools: 4
  angsd: 4
  pcangsd: 8
  realsfs: 8
  iqtree: 4

# ---- Optional: non-A. tonsa reads (stage_micro) --------------------------
# Kraken2: Unity's shared PlusPF (standard + RefSeq protozoa & fungi, 2025-10-15;
# hash.k2d 101 GB; Bracken files for 50-300 bp). phyloFlash SILVA: build once with
# workflow/setup_micro_dbs.sbatch (on /project, not /work).
micro:
  samples: all_libraries                 # pilot | all_libraries (recommended: incl. failed libraries as pseudo-blanks) | kept | path/to/ids.txt
  pilot_file: metadata/micro_pilot.txt
  unmapped_dir: results/01_mapping/unmapped   # temporary unmapped pairs, on SCRATCH (results/01_mapping is symlinked)
  phyloflash_db: /project/pi_matthew_sasaki_uml_edu/databases/phyloflash/138.1
  read_length: 136
  # Taxon-neutral SSU profile (workflow/scripts/ssu_profile.py)
  identity_steps: "98:0,95:1,90:2,85:3"   # identity:levels dropped from the end of the SILVA path
  low_identity_depth: 3          # lineage depth kept below the lowest identity step
  tie_tolerance: 0.5             # identity points within a mate's best hit treated as ties (-> LCA)
  groups_tsv: metadata/ssu_groups_of_interest.tsv   # optional convenience view; "" = none
  # Host (A. tonsa) rRNA filter: build once with target micro_host_ssu, then
  # put the reviewed A. tonsa SSU sequences in this FASTA ("" or missing = no filter)
  host_ssu: data/reference/host_rrna/acartia_ssu.fa
  host_ssu_min_id: 0.97
  host_ssu_samples: [TK_peak_1_09, MD_early_2_09, MD_peak_2_05, TK_late_2_07]   # clean, deep: X, F, S, IV
  # Optional Kraken2/Bracken (uninformative for eukaryotes in the pilot)
  kraken2_enabled: false
  kraken2_db: /datasets/bio/kraken2/PlusPF
  kraken2_confidence: 0.1
  kraken2_memory_mapping: false  # load DB into RAM (needs ~110 GB; see profile)
  bracken_read_len: 150
  bracken_threshold: 10
  ssu_summary_level: 6           # only used by the Kraken-based micro_summary
